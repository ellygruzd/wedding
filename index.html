<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ольга и Михаил</title>
<style>
  :root {
    --ink: #241a10;
    --ink-soft: rgba(36, 26, 16, .64);
    --ink-faint: rgba(36, 26, 16, .38);
    --paper: #efe0c7;
    --paper-2: #e6d2ac;
    --card: #f7ecd9;
    --gold: #9c6a24;
    --gold-soft: #b98a3f;
    --wine: #7a2c3d;
    --wine-soft: #8f3f50;
    --forest: #2c4231;
    --forest-soft: #3c5744;
    --line: rgba(36, 26, 16, .16);
    --shadow: rgba(36, 22, 10, .18);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #f3e6cf;
      --ink-soft: rgba(243, 230, 207, .68);
      --ink-faint: rgba(243, 230, 207, .42);
      --paper: #1a130c;
      --paper-2: #241a10;
      --card: #221810;
      --gold: #dba95a;
      --gold-soft: #c99a63;
      --wine: #cf7f8f;
      --wine-soft: #b8677a;
      --forest: #6b9776;
      --forest-soft: #7ca987;
      --line: rgba(243, 230, 207, .16);
      --shadow: rgba(0, 0, 0, .5);
    }
  }

  :root[data-theme="dark"] {
    --ink: #f3e6cf;
    --ink-soft: rgba(243, 230, 207, .68);
    --ink-faint: rgba(243, 230, 207, .42);
    --paper: #1a130c;
    --paper-2: #241a10;
    --card: #221810;
    --gold: #dba95a;
    --gold-soft: #c99a63;
    --wine: #cf7f8f;
    --wine-soft: #b8677a;
    --forest: #6b9776;
    --forest-soft: #7ca987;
    --line: rgba(243, 230, 207, .16);
    --shadow: rgba(0, 0, 0, .5);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper-2);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .frame {
    max-width: 560px;
    margin: 0 auto;
    background: var(--paper);
    min-height: 100dvh;
    position: relative;
    box-shadow: 0 0 60px var(--shadow);
  }

  /* --- preview ribbon --- */

  /* --- hero --- */
  .hero {
    position: relative;
    aspect-ratio: 4 / 5;
    overflow: hidden;
  }
  .hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 25%;
    display: block;
  }
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(20,12,4,0) 40%, rgba(20,12,4,.78) 92%);
    pointer-events: none;
  }
  .hero-names {
    position: absolute;
    left: 1.4rem;
    right: 1.4rem;
    bottom: 1.3rem;
    color: #f7ecd9;
    z-index: 2;
  }
  .hero-names .and {
    display: block;
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'URW Palladio L', serif;
    font-style: italic;
    font-weight: 420;
    font-size: 1.05rem;
    color: rgba(247, 236, 217, .78);
    margin-bottom: -.35rem;
  }
  .hero-names h1 {
    margin: 0;
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'URW Palladio L', serif;
    font-weight: 560;
    font-size: clamp(2.4rem, 11vw, 3.4rem);
    line-height: 1.02;
    letter-spacing: -.01em;
    text-wrap: balance;
  }

  .ticket {
    position: absolute;
    top: 1.1rem;
    right: 1.1rem;
    z-index: 2;
    background: var(--card);
    color: var(--ink);
    border-radius: 3px;
    padding: .55rem .7rem .5rem;
    transform: rotate(3deg);
    box-shadow: 0 6px 18px var(--shadow);
    text-align: center;
  }
  .ticket .day {
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-weight: 700;
    font-size: 1.5rem;
    line-height: 1;
  }
  .ticket .rest {
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: .58rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: .2rem;
  }

  /* --- invite copy --- */
  .invite {
    padding: 1.8rem 1.4rem 1.1rem;
    text-align: center;
  }
  .invite p {
    margin: 0;
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'URW Palladio L', serif;
    font-style: italic;
    font-weight: 420;
    font-size: 1.28rem;
    line-height: 1.34;
    color: var(--ink);
    text-wrap: balance;
    max-width: 30ch;
    margin: 0 auto;
  }

  /* --- capture card --- */
  .capture {
    margin: 1.3rem 1.4rem 0;
    padding: 1.3rem 1.2rem 1.4rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    text-align: center;
  }
  .name-field {
    display: flex;
    align-items: center;
    gap: .5rem;
    justify-content: center;
    margin-bottom: 1rem;
  }
  .name-field label {
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: .64rem;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .name-field input {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: .88rem;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: .15rem .1rem;
    width: 9.5rem;
    text-align: center;
  }
  .name-field input:focus { outline: none; border-color: var(--gold); }

  .shutter-btn {
    appearance: none;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: .7rem;
    background: var(--forest);
    color: var(--card);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-weight: 600;
    font-size: 1rem;
    padding: .9rem 1.5rem;
    border-radius: 999px;
    box-shadow: 0 10px 24px -8px var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .shutter-btn:hover { background: var(--forest-soft); transform: translateY(-1px); }
  .shutter-btn:active { transform: translateY(0); }
  .shutter-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .shutter-btn svg { width: 22px; height: 22px; flex: none; }

  .capture-hint {
    margin: .75rem 0 0;
    font-size: .78rem;
    color: var(--ink-faint);
  }

  /* --- feed section --- */
  .feed-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    margin: 2.2rem 1.4rem .9rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--line);
  }
  .feed-head h2 {
    margin: 0;
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'URW Palladio L', serif;
    font-weight: 560;
    font-size: 1.4rem;
  }
  .feed-count {
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: .72rem;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .feed-empty {
    margin: 0 1.4rem 2rem;
    padding: 2.1rem 1.2rem;
    border: 1.5px dashed var(--line);
    border-radius: 14px;
    text-align: center;
    color: var(--ink-soft);
  }
  .feed-empty svg { width: 34px; height: 34px; color: var(--gold-soft); margin-bottom: .6rem; }
  .feed-empty p { margin: 0; font-size: .92rem; line-height: 1.5; }
  .feed-empty p.small { font-size: .76rem; color: var(--ink-faint); margin-top: .35rem; }

  .feed-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .9rem;
    padding: 0 1.4rem 2.4rem;
  }
  .feed-card {
    background: var(--card);
    border-radius: 10px;
    padding: .4rem .4rem .55rem;
    box-shadow: 0 8px 18px -10px var(--shadow);
    cursor: pointer;
    border: none;
    text-align: left;
    font: inherit;
    color: inherit;
    display: block;
  }
  .feed-card:nth-child(3n+1) { transform: rotate(-1.1deg); }
  .feed-card:nth-child(3n+2) { transform: rotate(.9deg); }
  .feed-card:nth-child(3n) { transform: rotate(-.4deg); }
  .feed-card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 6px;
    display: block;
    background: var(--paper-2);
  }
  .feed-card .meta {
    display: flex;
    justify-content: space-between;
    gap: .4rem;
    padding: .45rem .2rem 0;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: .62rem;
    color: var(--ink-faint);
  }
  .feed-card .meta .who { color: var(--ink-soft); font-weight: 700; }

  footer {
    text-align: center;
    padding: 0 1.4rem 2.4rem;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: .66rem;
    letter-spacing: .04em;
    color: var(--ink-faint);
  }

  /* --- lightbox --- */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(12, 8, 4, .92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: 1.4rem;
    z-index: 50;
  }
  .lightbox[hidden] { display: none; }
  .lightbox img {
    max-width: 100%;
    max-height: 68dvh;
    border-radius: 8px;
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
  }
  .lightbox .lb-meta {
    color: #f3e6cf;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: .72rem;
    text-align: center;
  }
  .lightbox .lb-actions {
    display: flex;
    gap: .7rem;
  }
  .lb-btn {
    appearance: none;
    border: 1px solid rgba(243,230,207,.3);
    background: rgba(243,230,207,.08);
    color: #f3e6cf;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: .85rem;
    font-weight: 600;
    padding: .6rem 1.1rem;
    border-radius: 999px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: .4rem;
  }
  .lb-btn.primary { background: var(--gold); border-color: var(--gold); color: #241a10; }

  #camera-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    .shutter-btn, .feed-card { transition: none; }
  }
</style>
</head>

  /** Downscale/recompress file until its dataURL fits under maxChars, trying a
   *  few size/quality steps; calls cb(dataUrl) or cb(null) if the image never loads. */
  function compressUnderLimit(file, maxChars, cb) {
    var attempts = [
      { maxDim: 1400, quality: 0.75 },
      { maxDim: 1100, quality: 0.65 },
      { maxDim: 900, quality: 0.55 },
      { maxDim: 700, quality: 0.5 }
    ];
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        var result = null;
        for (var i = 0; i < attempts.length; i++) {
          var a = attempts[i];
          var scale = Math.min(1, a.maxDim / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement("canvas");
          canvas.width = cw; canvas.height = ch;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, cw, ch);
          var dataUrl = canvas.toDataURL("image/jpeg", a.quality);
          result = dataUrl;
          if (dataUrl.length <= maxChars) break;
        }
        cb(result);
      };
      img.onerror = function () { cb(null); };
      img.src = reader.result;
    };
    reader.onerror = function () { cb(null); };
    reader.readAsDataURL(file);
  }

  function formatTime(d) {
    var hh = String(d.getHours()).padStart(2, "0");

    photos.forEach(function (p, i) {
      var card = document.createElement("button");
      card.type = "button";
      card.className = "feed-card";
      card.setAttribute("aria-label", "Открыть фото от " + p.name);

      var img = document.createElement("img");
      img.src = p.src;
      img.loading = "lazy";
      img.alt = "Фото от " + p.name;
      card.appendChild(img);

      var meta = document.createElement("div");
      meta.className = "meta";
      var who = document.createElement("span");
      who.className = "who";
      who.textContent = p.name;
      var when = document.createElement("span");
      when.textContent = formatTime(p.time);
      meta.appendChild(who);
      meta.appendChild(when);
      card.appendChild(meta);

      card.addEventListener("click", function () { openLightbox(i); });
      feedGrid.appendChild(card);
    });
  }

  var currentPhoto = null;

  function openLightbox(i) {
    var p = photos[i];
    currentPhoto = p;
    lbImg.src = p.src;
    lbMeta.textContent = p.name + " · " + formatTime(p.time);
    lightbox.hidden = false;
  }
  lbClose.addEventListener("click", function () { lightbox.hidden = true; });
  lightbox.addEventListener("click", function (e) {
    if (e.target === lightbox) lightbox.hidden = true;
  });

  lbSave.addEventListener("click", function () {
    if (!currentPhoto) return;
    var filename = "свадьба-" + currentPhoto.name.replace(/[^a-zA-Zа-яА-Я0-9]+/g, "-") + ".jpg";
    fetch(currentPhoto.src)
      .then(function (r) { return r.blob(); })
      .then(function (blob) {
        var objUrl = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = objUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(objUrl); }, 4000);
      })
      .catch(function () { window.open(currentPhoto.src, "_blank"); });
  });

  renderFeed();

  function loadPhotos() {
    db.from("photos")
      .select("id,name,photo_data,created_at")
      .order("created_at", { ascending: false })
      .limit(500)
      .then(function (res) {
        if (res.error) { console.error(res.error); return; }
        photos = res.data.map(function (row) {
          return {
            id: row.id,
            src: row.photo_data,
            name: row.name || "Гость",
            time: row.created_at ? new Date(row.created_at) : new Date()
          };
        });
        renderFeed();
      })
      .catch(function (err) { console.error(err); });
  }

  loadPhotos();
  setInterval(loadPhotos, 4000);
})();
</script>
</body>
</html>
